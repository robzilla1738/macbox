[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macbox"
version = "0.1.0"
description = "Local macOS sandbox runner for disposable Tart-backed VM testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "mcp>=1.0",
]

[project.scripts]
macbox = "macbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
